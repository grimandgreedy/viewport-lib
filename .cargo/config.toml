# Shorthands for the example crates that sit outside the workspace (see the root
# Cargo.toml). They are named by manifest path instead of `-p`; these aliases hide
# the path.
[alias]
# Append `--example <name>`.
eframe-examples = "run --release --manifest-path crates/viewport-lib-examples/eframe/Cargo.toml"
check-eframe-examples = "check --manifest-path crates/viewport-lib-examples/eframe/Cargo.toml --all-targets"
# Slint and Bevy pin wgpu 29.
slint-example = "run --release --manifest-path crates/viewport-lib-examples/slint/Cargo.toml --example slint-minimal"
bevy-example = "run --release --manifest-path crates/viewport-lib-examples/bevy/Cargo.toml --example bevy-swarm"
# The build-check halves of the same two, for the post-API-change sweep.
check-slint-example = "check --manifest-path crates/viewport-lib-examples/slint/Cargo.toml --all-targets"
check-bevy-example = "check --manifest-path crates/viewport-lib-examples/bevy/Cargo.toml --all-targets"
# The mobile example in a desktop window; `cargo android run` and `cargo apple
# run` from the crate directory build for a device, and scripts/check_mobile.sh
# compile-checks both mobile targets.
mobile-example = "run --release --manifest-path crates/viewport-lib-examples/mobile/Cargo.toml --bin mobile-desktop"
check-mobile-example = "check --manifest-path crates/viewport-lib-examples/mobile/Cargo.toml --all-targets"
# The eframe showcase on wgpu 30, where the path tracer and lightmap baker use
# hardware ray queries on Apple silicon. The eframe crate defaults to wgpu 27
# while some of its examples are still pinned there, so the leg is named here.
showcase = "run --release --manifest-path crates/viewport-lib-examples/eframe/Cargo.toml --no-default-features --features wgpu30,showcase --example showcase"
