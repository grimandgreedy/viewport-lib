[package]
name = "viewport-lib-plugins"
version = "0.1.0"
edition = "2024"
description = "Plugins for viewport-lib: the built-in item types (point clouds, sprites, curves, volumes, vector and tensor fields and the rest) and deformers such as a cut for section views and thresholds"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib"
keywords = ["3d", "viewport", "viewport-lib", "rendering", "visualization"]
categories = ["graphics", "rendering", "visualization"]
rust-version = "1.85"
publish = true

[dependencies]
# The renderer and everything that draws sit behind the `gpu` feature, so the
# data types a consumer builds compile against viewport-lib-types alone.
viewport-lib = { path = "../viewport-lib", version = "0.22", default-features = false, optional = true }
viewport-lib-types = { path = "../viewport-lib-types", version = "0.2", optional = true }
# Marching-cubes tables, the trilinear sampler and the primitive builders
# the volume family reaches for, from the crate that owns them.
viewport-lib-geometry = { path = "../viewport-lib-geometry", version = "0.2", optional = true }
glam = { workspace = true }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"], optional = true }
# Ray/trimesh cast for the volume-surface-slice CPU pick, the same version
# viewport-lib uses so the two agree on hit geometry.
parry3d = { version = "0.26", optional = true }

[dev-dependencies]
viewport-lib-testkit = { path = "../viewport-lib-testkit", default-features = false, features = ["core"] }

[features]
default = ["gpu", "wgpu27", "item-types", "deformers"]
# The plugins themselves: stores, pipelines, shaders and upload calls. Off, the
# crate holds only the data types a consumer builds (with `item-types`), and
# depends on neither viewport-lib nor wgpu. Each wgpu leg turns this on.
gpu = ["dep:viewport-lib", "dep:parry3d"]
# One feature per module. A dependent on a non-default wgpu leg turns default
# features off, so it names the modules it wants alongside the leg.
item-types = ["dep:viewport-lib-types", "dep:viewport-lib-geometry"]
deformers = ["gpu"]
# One leg, matching the viewport-lib the crate is built against. The renderer
# re-exports its wgpu as `viewport_lib::gpu`, and everything here names types
# through that path, so selecting the leg here is the whole of it.
wgpu27 = ["gpu", "viewport-lib/wgpu27"]
wgpu29 = ["gpu", "viewport-lib/wgpu29"]
wgpu30 = ["gpu", "viewport-lib/wgpu30"]
serde = ["dep:serde", "viewport-lib-types?/serde", "viewport-lib?/serde"]
# Embed this crate's WGSL with comments and indentation removed (the default on
# wasm32), and turn on the same feature in viewport-lib.
minify-shaders = ["gpu", "viewport-lib/minify-shaders"]
