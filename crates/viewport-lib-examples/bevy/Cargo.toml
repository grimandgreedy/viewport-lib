# Not a member of the parent workspace: Bevy 0.19 pins wgpu 29, so this crate
# pins viewport-lib's `wgpu29` leg. Features unify across a workspace build, so a
# member here would turn the 29 leg on for every crate that defaults to 27 and
# trip viewport-lib's one-leg `compile_error!`. An empty `[workspace]` table
# detaches it into its own workspace root, exactly like the testkit.
[workspace]

[package]
name = "viewport-lib-examples-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Bevy-hosted viewport-lib example (wgpu 29 leg, shared device)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Bevy 0.19 pins wgpu 29, so it shares viewport-lib's wgpu29 leg: viewport-lib
# renders straight into a Bevy GPU texture on Bevy's own device with no CPU copy.
viewport-lib = { path = "../../viewport-lib", default-features = false, features = ["wgpu29"] }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bevy = { version = "0.19" }

[dev-dependencies]
# naga picks its diagnostic writer type from its own `termcolor` feature, while
# `codespan_reporting::term::emit` picks the trait it demands from
# codespan-reporting's `termcolor` feature. Bevy's `naga_oil` turns
# codespan-reporting/termcolor on for the shared instance, so without this naga
# hands a `String` to an API that now wants `WriteColor` and fails to compile.
# Enabling naga's own `termcolor` keeps the two in sync. This reconciliation is
# the reason the Bevy example has its own crate rather than sharing one.
naga = { version = "27", features = ["termcolor"] }

[[example]]
name = "bevy-swarm"
path = "examples/bevy_swarm/main.rs"
