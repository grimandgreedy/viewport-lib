<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewport-lib : web (WebGPU)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101014;
        color: #cfcfd6;
        font: 14px/1.5 system-ui, sans-serif;
      }
      /* winit appends its <canvas> to <body>. Give it a fixed viewport-relative
         CSS size: winit's resize observer sets the backing store from the CSS
         size times devicePixelRatio, so a size that does NOT depend on the
         backing store is required, otherwise the two feed back and the canvas
         grows without bound. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      /* Overlay caption that never intercepts orbit/zoom (pointer-events: none). */
      #note {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 720px;
        text-align: center;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(16, 16, 20, 0.6);
        opacity: 0.85;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="note">
      Drag to orbit, scroll to zoom. Needs a WebGPU-capable browser (recent
      Chrome or Edge; Safari and Firefox behind a flag). If nothing appears,
      open the console.
    </div>
    <!-- winit appends its own <canvas> to <body>; nothing to declare here. -->
    <script type="module">
      import init from "./pkg/winit-web.js";
      init().catch((err) => {
        // wasm-bindgen throws a control-flow exception to unwind out of the
        // winit event loop start on the web; that one is expected, log the rest.
        if (!String(err).includes("Using exceptions for control flow")) {
          console.error(err);
        }
      });
    </script>
  </body>
</html>
