[package]
name = "viewport-lib"
version = "0.22.0"
edition = "2024"
description = "3D viewport rendering library"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib"
homepage = "https://github.com/grimandgreedy/viewport-lib"
documentation = "https://docs.rs/viewport-lib"
keywords = ["3d", "viewport", "wgpu", "rendering", "visualization"]
categories = ["graphics", "rendering", "visualization"]
rust-version = "1.85"
publish = true

[build-dependencies]
# Defines the `wgpu27` / `wgpu29` cfg aliases (see build.rs) so the version-seam
# modules can write `#[cfg(wgpu27)]` for "the 27 leg, and only the 27 leg" rather
# than spelling the exclusive `all(feature = "wgpu27", not(feature = "wgpu29"))`.
cfg_aliases = "0.2"

[dependencies]
# Exactly one wgpu version is compiled, picked by the mutually exclusive
# `wgpu27` / `wgpu29` features (see `src/gpu.rs`). The primary (27) version keeps
# the plain `wgpu` name so tests, doctests, and examples that name `wgpu::`
# directly need no changes; `wgpu29` is the same crates.io crate under a local
# alias. Cargo unifies the enabled version with the host's `wgpu` so device
# types match across the boundary.
wgpu = { version = "27.0", features = ["metal", "vulkan"], optional = true }
wgpu29 = { package = "wgpu", version = "29.0", features = ["metal", "vulkan"], optional = true }
wgpu30 = { package = "wgpu", version = "30.0", features = ["metal", "vulkan"], optional = true }
glam = { workspace = true }
viewport-lib-types = { path = "../viewport-lib-types", version = "0.2.0" }
viewport-lib-geometry = { path = "../viewport-lib-geometry", version = "0.2.0" }
viewport-lib-input = { path = "../viewport-lib-input", version = "0.2.0" }
bytemuck = { version = "1.25", features = ["derive"] }
spatial-query = "0.1"
parry3d = "0.26"
bitflags = "2"
rayon = "1"
half = "2"
# Curve flattening + fill-rule tessellation for `OverlayShape::Vector`. Small,
# pure-Rust; the tessellation and path crates only (not the `lyon` umbrella,
# which also pulls `lyon_algorithms` we do not use).
lyon_tessellation = "1"
lyon_path = "1"
fontdue = "0.9"
# Color glyph (emoji) rasterization for the overlay atlas: fontdue is coverage
# only, so `ttf-parser` reads the embedded bitmap strikes (sbix / CBDT) and `png`
# decodes them. Core overlay text, not an optional format, so both are plain deps.
ttf-parser = "0.25"
png = "0.18"
thiserror = "2.0"
tracing = { version = "0.1", features = ["log"] }
serde = { version = "1.0", features = ["derive"], optional = true }
# Clock for timing/stats. A drop-in for `std::time` that re-exports it on native
# and uses `performance.now()` on wasm, where `std::time::Instant::now()` panics.
web-time = "1"

# --- Optional host integrations (consumer-facing) ---
# `winit`/`pollster` power the `app` runners and the `from_winit` event adapter.
# The `from_egui` event adapter lives in viewport-lib-input, which carries one
# aliased egui per supported version; the `egui-adapter*` features below forward
# to it, so no egui dependency is needed here.
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }

# Native handles for the hardware VRAM budget query (`resources::vram_budget`).
# Versions must match the ones wgpu-hal 27 resolves so the raw types are identical.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = "0.32"

# Vulkan handles for the VRAM budget query on native non-Apple targets. Excluded
# on wasm, which has no native device handle (see `resources::memory`).
[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
ash = "0.38"

# On wasm the only usable wgpu backend is WebGPU. This unions the `webgpu`
# feature into the same optional `wgpu` dep the `wgpu27` feature activates; the
# native `metal`/`vulkan` features compile to nothing on this target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "27.0", features = ["webgpu"], optional = true }

[features]
default = ["serde", "wgpu27"]
serde = ["dep:serde", "glam/serde", "bitflags/serde"]
# wgpu version selection. Enable exactly one; `src/gpu.rs` emits a
# `compile_error!` for zero or both. `wgpu27` activates the plain `wgpu`
# dependency (the 27 crate keeps its real name); `wgpu29` activates the aliased
# 29 crate.
wgpu27 = ["dep:wgpu"]
wgpu29 = ["dep:wgpu29"]
wgpu30 = ["dep:wgpu30"]
# Offscreen path tracer (src/raytrace/). Off by default, so the default build
# is unchanged for non-users. Compute only, no hardware ray query; reuses the
# shared helpers/brdf.wgsl.
raytrace = []
# Lightmap bake primitives (src/bake/). Off by default. Currently the texel
# G-buffer pass: rasterise a mesh into UV1/atlas space to get per-texel world
# position and normal, the input a lightmap GI solve integrates from.
bake = []
# Opt in to the hardware ray-query traversal backend (Vulkan/DX12). The tracer
# still selects the portable compute traversal unless the device advertises the
# ray-query feature; this only lets `pick_backend` choose the hardware path when
# it is available. Unsupported on Metal and the web, so it stays off by default.
raytrace-hardware = ["raytrace"]
# Enables the `JobHandle` future wrapper. Off by default so the crate stays
# free of `std::future` plumbing for consumers that do not run an async
# runtime.
future = []
# Session host integrations (consumer-facing). `winit-adapter` enables the
# `from_winit` event translation; `app` adds the fullscreen `ViewportApp` runner
# (winit window + wgpu bring-up + event loop); `egui-adapter` enables the
# `from_egui` event translation for hosts embedding a viewport in egui.
winit-adapter = ["dep:winit", "viewport-lib-input/winit-adapter"]
app = ["winit-adapter", "dep:pollster"]
# `from_egui` is built against one egui version, so pick the feature matching
# the egui your host runs: 0.33 pairs with the wgpu27 leg, 0.35 with wgpu29,
# 0.36 with wgpu30 (a framework that embeds wgpu pins both). Enable one.
egui-adapter = ["viewport-lib-input/egui-adapter"]
egui-adapter-035 = ["viewport-lib-input/egui-adapter-035"]
egui-adapter-036 = ["viewport-lib-input/egui-adapter-036"]
[dev-dependencies]
# Parses generated WGSL in the bindless and path-tracer unit tests.
naga = "27"
# Blocks on the async device request in the headless integration tests.
pollster = "0.4"
# Used by the headless color-glyph test to look up an emoji glyph id. Same crate
# as the normal dependency; listed here so the integration test can name it.
ttf-parser = "0.25"
# The lightmap-bake integration test runs the full offline lightmapper: this
# crate's unwrap (xatlas) feeding viewport-lib's texel G-buffer + GI bake.
# Desktop-only: xatlas is C++ and does not cross-compile to wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
viewport-lib-lightbake = { version = "0.1.0" }
# The headless integration tests share one device constructor with the testkit
# instead of keeping their own copies. `core` only, so no scene catalogue or
# `image` is pulled; path-only and dev-only, so it never reaches the published
# manifest, and its wgpu leg comes from this crate's (unified) instance. The
# dev-dependency cycle (the testkit depends on `viewport-lib`) is permitted
# because dev-dependencies are outside the normal build graph.
viewport-lib-testkit = { path = "../viewport-lib-testkit", default-features = false, features = ["core"] }

# CPU picking build/refit/query timing. Custom harness (uses std::time), so run
# with `cargo bench --bench pick_bench`.
[[bench]]
name = "pick_bench"
harness = false
