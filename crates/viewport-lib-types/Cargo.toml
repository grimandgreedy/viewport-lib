[package]
name = "viewport-lib-types"
version = "0.2.0"
edition = "2024"
description = "Pure-data types for viewport-lib: submission payloads, handles, and frame config, free of any GPU dependency."
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib"
homepage = "https://github.com/grimandgreedy/viewport-lib"
documentation = "https://docs.rs/viewport-lib-types"
keywords = ["3d", "viewport", "types", "mesh", "visualization"]
categories = ["graphics", "rendering", "data-structures"]
rust-version = "1.85"
publish = true

[features]
default = ["serde"]
serde = ["dep:serde", "glam/serde"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2.0"

# CPU parallelism for the whole workspace, behind `par`. Not pulled in on wasm:
# that target has no OS threads, so rayon would only panic on first use, and
# `par` runs serially there instead. See `src/par.rs`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
