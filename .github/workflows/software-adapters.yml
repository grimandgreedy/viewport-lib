name: Software adapters

# The platforms a runner can exercise without real hardware that the gating CI
# workflow (ci.yml, which runs lavapipe and the wasm check) does not cover:
# WARP (Direct3D 12) on Windows and llvmpipe (GL) on Linux run the headless
# tests, beside the web smoke page in headless Chrome and the Android and iOS
# compile checks. None of it gates anything: the workflow runs nightly and when
# started by hand from the Actions tab, and a job or step that is expected to
# fail says so where it is declared. A platform with no job here or in ci.yml
# is a platform nobody is testing, which is how a backend quietly stops
# working.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  # Software rasterisers are slow enough that debug builds time out.
  CARGO_PROFILE_RELEASE_DEBUG: 0
  # Every headless test skips quietly when no adapter exists. This makes the
  # gpu_available canary fail instead, so a runner with a broken adapter setup
  # cannot report green while testing nothing.
  VIEWPORT_REQUIRE_GPU: 1
  # No adapter here has a blessed golden set, so every golden check (the
  # catalogue snapshots and the compatibility goldens inside the testkit run)
  # renders without comparing. Frames go under the target directory, never
  # into tests/snapshots/.
  GOLDEN_RENDER_ONLY: 1

jobs:
  warp:
    name: WARP (DX12, Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # wgpu enumerates WARP as a CPU adapter and request_adapter falls back to
      # it when the runner offers no hardware adapter. Pinning the backend
      # keeps the GL path out of the picture.
      WGPU_BACKEND: dx12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Adapter probe
        run: cargo test --release -p viewport-lib --test gpu_available -- --nocapture

      # Allowed to fail so the testkit steps below still report: the library
      # tests can take the process down on WARP, and then nothing after them
      # would run.
      - name: Library headless tests
        id: library_tests
        continue-on-error: true
        run: cargo test --release -p viewport-lib --tests

      # When the library tests failed, the foreground item case again on its
      # own, with wgpu's warnings, its validation layer and a backtrace, so the
      # log names the call that hangs or the error before it. It hung and then
      # crashed the process on WARP; the step timeout stops a hang holding the
      # job for the rest of its 90 minutes.
      - name: Foreground item case with wgpu logging
        if: steps.library_tests.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: wgpu_core=warn,wgpu_hal=warn,naga=warn
          WGPU_VALIDATION: 1
          WGPU_DEBUG: 1
        run: >-
          cargo test --release -p viewport-lib --lib
          renderer::lazy_pipeline_tests::foreground_item
          -- --exact --nocapture --test-threads=1

      # --tests keeps the examples out of the build: they pull eframe, which
      # the runner does not need.
      - name: Testkit tests
        working-directory: crates/viewport-lib-testkit
        run: cargo test --release --tests

      # Renders every catalogue scene without comparing pixels.
      - name: Catalogue scenes render
        working-directory: crates/viewport-lib-testkit
        run: cargo test --release --test snapshots

      # The library tests were let fail so the steps above could still run;
      # the job still fails for them.
      - name: Fail the job if the library tests failed
        if: always() && steps.library_tests.outcome == 'failure'
        run: exit 1

  llvmpipe-gl:
    name: llvmpipe (GL, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # llvmpipe reports a GL 4.5 context, which clears the storage floor, so the
    # renderer builds at the full tier here and every shader goes through naga's
    # GLSL writer. The tier tests come first and are the part of this job that
    # has to pass: they also run the overlay-only renderer on the WebGL2 limits.
    # The broader steps after them are the first run of the whole shader set on
    # GL and may fail; they are kept so the failure list is in the log rather
    # than unknown.
    env:
      WGPU_BACKEND: gl
      LIBGL_ALWAYS_SOFTWARE: 1
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Mesa GL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2 mesa-utils
          eglinfo -B || true

      - name: Adapter probe
        run: cargo test --release -p viewport-lib --test gpu_available -- --nocapture

      - name: Tier tests
        working-directory: crates/viewport-lib-testkit
        run: cargo test --release --test tier

      - name: Library headless tests
        continue-on-error: true
        run: cargo test --release -p viewport-lib --tests

      - name: Testkit tests
        continue-on-error: true
        working-directory: crates/viewport-lib-testkit
        run: cargo test --release --tests

      # As on WARP, renders every scene without comparing pixels.
      - name: Catalogue scenes render
        continue-on-error: true
        working-directory: crates/viewport-lib-testkit
        run: cargo test --release --test snapshots

  web-smoke:
    name: Web smoke page (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Cargo.lock is not committed, so resolve it first and install the
      # wasm-bindgen CLI at the version it picked: the two must match exactly.
      - name: Resolve the wasm-bindgen version
        id: lock
        run: |
          cargo generate-lockfile
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$version"
          echo "wasm-bindgen $version"
          echo "wasm_bindgen=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.lock.outputs.wasm_bindgen }}

      # Builds the smoke example, serves it, loads it in headless Chrome and
      # reads the page's report. It runs twice: on WebGPU, and with the GPU
      # process off, where the page falls back to WebGL2 and the overlay-only
      # renderer. The page names the API it landed on, so a run that took the
      # wrong path fails rather than passing on the other one. The runner has
      # no GPU, and Chrome does not always offer its software adapter as the
      # default, so the WebGPU runs name SwiftShader.
      - name: Run the smoke page
        run: |
          VPL_WASM_TOOLCHAIN="$(rustc --print sysroot)" \
          VPL_CHROME="$(command -v google-chrome)" \
          VPL_WEBGPU_ADAPTER=swiftshader \
          scripts/check_web.sh

  mobile-check:
    name: Mobile compile check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
            flag: --android
          - os: macos-latest
            target: aarch64-apple-ios-sim
            flag: --ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/viewport-lib-examples/mobile

      # A compile check only: cargo check does not link, so no NDK or Xcode
      # project is needed. Deploying to a device is a hand step (see the
      # crate's README).
      - name: Check the mobile example
        run: VPL_MOBILE_TOOLCHAIN="$(rustc --print sysroot)" scripts/check_mobile.sh ${{ matrix.flag }}
