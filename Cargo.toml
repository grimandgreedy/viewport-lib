[workspace]
resolver = "3"
members = [
    "crates/viewport-lib",
    "crates/viewport-lib-types",
    "crates/viewport-lib-geometry",
]

# Shared dependency pins. Both crates take `glam` from here so the version can
# never drift across the workspace boundary (a mismatch would make `Vec3`/`Mat4`
# fail to unify between the renderer and the types crate).
[workspace.dependencies]
glam = { version = "=0.30.10", features = ["bytemuck"] }
