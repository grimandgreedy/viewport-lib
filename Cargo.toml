[workspace]
resolver = "3"
members = [
    "crates/viewport-lib",
    "crates/viewport-lib-types",
    "crates/viewport-lib-geometry",
    "crates/viewport-lib-input",
]
# The testkit lives in `crates/` and has its own `[workspace]` table (it is a
# `publish = false` crate, not a member, so `cargo publish -p viewport-lib` stays
# clean). Excluding it here stops cargo treating that nested workspace root as
# part of this one when `viewport-lib`'s dev-dependency resolves the path.
exclude = ["crates/viewport-lib-testkit"]

# Shared dependency pins. Both crates take `glam` from here so the version can
# never drift across the workspace boundary (a mismatch would make `Vec3`/`Mat4`
# fail to unify between the renderer and the types crate).
[workspace.dependencies]
glam = { version = "=0.30.10", features = ["bytemuck"] }
