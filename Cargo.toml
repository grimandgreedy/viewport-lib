[package]
name = "viewport-lib"
version = "0.19.0"
edition = "2024"
description = "3D viewport rendering library"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib"
homepage = "https://github.com/grimandgreedy/viewport-lib"
documentation = "https://docs.rs/viewport-lib"
keywords = ["3d", "viewport", "wgpu", "rendering", "visualization"]
categories = ["graphics", "rendering", "visualization"]
rust-version = "1.85"
publish = true
exclude = ["examples/"]

[dependencies]
# Exactly one wgpu version is compiled, picked by the mutually exclusive
# `wgpu27` / `wgpu29` features (see `src/gpu.rs`). The primary (27) version keeps
# the plain `wgpu` name so tests, doctests, and examples that name `wgpu::`
# directly need no changes; `wgpu29` is the same crates.io crate under a local
# alias. Cargo unifies the enabled version with the host's `wgpu` so device
# types match across the boundary.
wgpu = { version = "27.0", features = ["metal", "vulkan"], optional = true }
wgpu29 = { package = "wgpu", version = "29.0", features = ["metal", "vulkan"], optional = true }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
parry3d = "0.26"
bitflags = "2"
rayon = "1"
half = "2"
fontdue = "0.9"
thiserror = "2.0"
tracing = { version = "0.1", features = ["log"] }
serde = { version = "1.0", features = ["derive"], optional = true }

# --- Example-only dependencies (all optional, enabled by `example-*` features) ---
# Cargo compiles every non-optional dev-dependency for ANY example/test build,
# so the UI frameworks live here as optional deps instead: building one example
# only compiles the framework it declares via `required-features`. Consumers
# should never enable these features; they exist purely for `cargo run
# --example`.
iced = { version = "0.14", features = ["wgpu"], optional = true }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"], optional = true }
# egui 0.35 pairs with wgpu 29. Kept as a renamed dep alongside eframe 0.33 so
# the wgpu29 example can pair egui 0.35 with viewport-lib's 29 leg without
# moving the other eframe examples (still on 0.33 / the 27 leg).
eframe035 = { package = "eframe", version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"], optional = true }
# Slint pairs with wgpu 29 through its unstable-wgpu-29 feature (tilde
# requirement per Slint's own guidance: the feature is re-issued per wgpu
# major).
slint = { version = "~1.17", features = ["unstable-wgpu-29", "renderer-femtovg-wgpu"], optional = true }
# Bevy 0.19 pins wgpu 29, so it shares viewport-lib's wgpu29 leg: viewport-lib
# renders straight into a Bevy GPU texture on Bevy's own device with no CPU copy.
bevy = { version = "0.19", optional = true }
# Model/scene import (glTF, STL, VTK, HDF5, ...). Heavy; only showcase 45 uses it.
viewport-lib-io = { version = "0.2.0", path = "../viewport-lib-io", optional = true }

# --- Optional host integrations for `session` (consumer-facing, not example-only) ---
# `winit`/`pollster` power the `app` fullscreen runner and the `from_winit` event
# adapter; they are also dev-dependencies so the hand-written winit examples build
# without any feature. `egui`/`egui-wgpu` power the `egui-bridge` (event adapter +
# CallbackTrait impl); they pair with the wgpu27 leg, matching eframe 0.33.
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
egui = { version = "0.33", optional = true }

# Native handles for the hardware VRAM budget query (`resources::vram_budget`).
# Versions must match the ones wgpu-hal 27 resolves so the raw types are identical.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = "0.32"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
ash = "0.38"

[features]
default = ["serde", "wgpu27"]
serde = ["dep:serde", "glam/serde", "bitflags/serde"]
# wgpu version selection. Enable exactly one; `src/gpu.rs` emits a
# `compile_error!` for zero or both. `wgpu27` activates the plain `wgpu`
# dependency (the 27 crate keeps its real name); `wgpu29` activates the aliased
# 29 crate.
wgpu27 = ["dep:wgpu"]
wgpu29 = ["dep:wgpu29"]
# Offscreen path tracer (src/raytrace/). Off by default, so the default build
# is unchanged for non-users. Compute only, no hardware ray query; reuses the
# shared helpers/brdf.wgsl.
raytrace = []
# Lightmap bake primitives (src/bake/). Off by default. Currently the texel
# G-buffer pass: rasterise a mesh into UV1/atlas space to get per-texel world
# position and normal, the input a lightmap GI solve integrates from.
bake = []
# Opt in to the hardware ray-query traversal backend (Vulkan/DX12). The tracer
# still selects the portable compute traversal unless the device advertises the
# ray-query feature; this only lets `pick_backend` choose the hardware path when
# it is available. Unsupported on Metal and the web, so it stays off by default.
raytrace-hardware = ["raytrace"]
# Enables the `JobHandle` future wrapper. Off by default so the crate stays
# free of `std::future` plumbing for consumers that do not run an async
# runtime.
future = []
# Session host integrations (consumer-facing). `winit-adapter` enables the
# `from_winit` event translation; `app` adds the fullscreen `ViewportApp` runner
# (winit window + wgpu bring-up + event loop); `egui-adapter` enables the
# `from_egui` event translation for hosts embedding a viewport in egui.
winit-adapter = ["dep:winit"]
app = ["winit-adapter", "dep:pollster"]
egui-adapter = ["dep:egui"]
# Example-only dependency gates (see the optional deps above). Each example's
# `required-features` names the gate(s) it needs, so `cargo run --example X
# --features example-*` compiles only that example's framework. Not for
# consumers.
example-egui = ["dep:eframe"]
example-egui-wgpu29 = ["dep:eframe035"]
example-iced = ["dep:iced"]
example-slint = ["dep:slint"]
example-bevy = ["dep:bevy"]
example-io = ["dep:viewport-lib-io"]

[dev-dependencies]
# naga 27 (pulled by the iced / eframe 0.33 example deps) picks its diagnostic
# writer type from its own `termcolor` feature, while
# `codespan_reporting::term::emit` picks the trait it demands from
# codespan-reporting's `termcolor` feature. Bevy's `naga_oil` turns
# codespan-reporting/termcolor on for the shared 0.12 instance, so without this
# naga 27 hands a `String` to an API that now wants `WriteColor` and fails to
# compile. Enabling naga's own `termcolor` keeps the two in sync.
naga = { version = "27", features = ["termcolor"] }
winit = "0.30"
pollster = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The lightmap-bake showcase runs the full offline lightmapper: this crate's
# unwrap (xatlas) feeding viewport-lib's texel G-buffer + GI bake. Example-only.
viewport-lib-bake = { path = "../viewport-lib-bake" }



[[example]]
name = "eframe-minimal"
path = "examples/eframe_minimal/main.rs"
required-features = ["wgpu27", "example-egui", "egui-adapter"]

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
required-features = ["wgpu27", "example-egui", "egui-adapter", "raytrace", "bake"]

[[example]]
name = "eframe-minimal-wgpu29"
path = "examples/eframe_minimal_wgpu29/main.rs"
