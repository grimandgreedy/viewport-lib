<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewport-lib : web (WebGPU)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #cfcfd6;
        font: 14px/1.5 system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
      }
      canvas {
        outline: none;
        border-radius: 4px;
      }
      #note {
        max-width: 720px;
        text-align: center;
        opacity: 0.75;
      }
      code {
        color: #9ecbff;
      }
    </style>
  </head>
  <body>
    <div id="note">
      Drag to orbit, scroll to zoom. Needs a WebGPU-capable browser (recent
      Chrome or Edge; Safari and Firefox behind a flag). If nothing appears,
      open the console: a missing WebGPU adapter is logged there.
    </div>
    <!-- winit appends its own <canvas> to <body>; nothing to declare here. -->
    <script type="module">
      import init from "./pkg/winit-web.js";
      init().catch((err) => {
        // wasm-bindgen throws a control-flow exception to unwind out of the
        // winit event loop start on the web; that one is expected, log the rest.
        if (!String(err).includes("Using exceptions for control flow")) {
          console.error(err);
        }
      });
    </script>
  </body>
</html>
